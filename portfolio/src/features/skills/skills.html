<section id="skills" aria-labelledby="skills-heading" class="py-24">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <header class="text-center mb-16">
            <h2 id="skills-heading"
                class="font-display text-3xl sm:text-4xl lg:text-5xl font-bold mb-4"><span
                    class="gradient-text">ทักษะและเครื่องมือ</span></h2>
            <p class="text-slate-400 text-lg max-w-2xl mx-auto">เครื่องมือและเทคโนโลยีที่ใช้ในการสร้างสรรค์ผลงาน</p>
        </header>

        <div role="tablist" aria-label="Skill categories" class="flex flex-wrap justify-center gap-2 mb-12">
            <button role="tab" aria-selected="true" aria-controls="skills-panel-all" id="skills-tab-all"
                data-category="all"
                class="skills-tab tab-active px-6 py-3 rounded-full text-sm font-medium transition-all duration-300">
                ทั้งหมด
            </button>
            <button role="tab" aria-selected="false" aria-controls="skills-panel-dev" id="skills-tab-dev"
                data-category="dev"
                class="skills-tab px-6 py-3 rounded-full text-sm font-medium bg-slate-800 hover:bg-slate-700 transition-all duration-300">
                Development
            </button>
            <button role="tab" aria-selected="false" aria-controls="skills-panel-design" id="skills-tab-design"
                data-category="design"
                class="skills-tab px-6 py-3 rounded-full text-sm font-medium bg-slate-800 hover:bg-slate-700 transition-all duration-300">
                Design
            </button>
            <button role="tab" aria-selected="false" aria-controls="skills-panel-marketing" id="skills-tab-marketing"
                data-category="marketing"
                class="skills-tab px-6 py-3 rounded-full text-sm font-medium bg-slate-800 hover:bg-slate-700 transition-all duration-300">
                Marketing
            </button>
        </div>

        <div id="skills-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
    </div>
</section>
