<section id="services" aria-labelledby="services-heading" class="py-24 bg-slate-900/50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <header class="text-center mb-16">
            <h2 id="services-heading"
                class="font-display text-3xl sm:text-4xl lg:text-5xl font-bold mb-4"><span
                    class="gradient-text">บริการของเรา</span></h2>
            <p class="text-slate-400 text-lg max-w-2xl mx-auto">บริการครบวงจรที่ตอบโจทย์ทุกความต้องการด้าน
                Digital</p>
        </header>

        <div role="tablist" aria-label="Service categories"
            class="flex flex-wrap justify-center gap-2 mb-12">
            <button role="tab" aria-selected="true" aria-controls="panel-all" id="tab-all"
                data-category="all"
                class="service-tab tab-active px-6 py-3 rounded-full text-sm font-medium transition-all duration-300">
                ทั้งหมด
            </button>
            <button role="tab" aria-selected="false" aria-controls="panel-content" id="tab-content"
                data-category="content"
                class="service-tab px-6 py-3 rounded-full text-sm font-medium bg-slate-800 hover:bg-slate-700 transition-all duration-300">
                Content
            </button>
            <button role="tab" aria-selected="false" aria-controls="panel-design" id="tab-design"
                data-category="design"
                class="service-tab px-6 py-3 rounded-full text-sm font-medium bg-slate-800 hover:bg-slate-700 transition-all duration-300">
                Design
            </button>
            <button role="tab" aria-selected="false" aria-controls="panel-development" id="tab-development"
                data-category="development"
                class="service-tab px-6 py-3 rounded-full text-sm font-medium bg-slate-800 hover:bg-slate-700 transition-all duration-300">
                Development
            </button>
            <button role="tab" aria-selected="false" aria-controls="panel-marketing" id="tab-marketing"
                data-category="marketing"
                class="service-tab px-6 py-3 rounded-full text-sm font-medium bg-slate-800 hover:bg-slate-700 transition-all duration-300">
                Marketing
            </button>
            <button role="tab" aria-selected="false" aria-controls="panel-media" id="tab-media"
                data-category="media"
                class="service-tab px-6 py-3 rounded-full text-sm font-medium bg-slate-800 hover:bg-slate-700 transition-all duration-300">
                Media
            </button>
            <button role="tab" aria-selected="false" aria-controls="panel-other" id="tab-other"
                data-category="other"
                class="service-tab px-6 py-3 rounded-full text-sm font-medium bg-slate-800 hover:bg-slate-700 transition-all duration-300">
                อื่นๆ
            </button>
        </div>

        <div id="services-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>
</section>
